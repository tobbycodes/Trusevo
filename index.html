<html lang="en">
  <head>

    <title>Trusevo | Creative Web Design & Development Studio</title>

    <!-- meta description -->
    <meta

    <link rel="canonical" href="https://trusevo.com/">

    <!-- Open Graph -->
    <meta property="og:site_name" content="Trusevo">

    <meta name="twitter:card" content="summary_large_image" />

      name="twitter:title"
      content="Trusevo | Creative Web Design & Development Studio"
    />
    <meta
      name="twitter:description"
      content="Trusevo Studio designs and develops modern websites that build trust, attract enquiries, and help businesses grow online."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.png" />
 
    

    <!-- WebSite schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

    <!-- Organization schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
